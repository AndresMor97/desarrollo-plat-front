<div class="form-card">
  <div class="form-header">
    <h2>Categorías</h2>
    <p>Crea y gestiona tus categorías personalizadas</p>
  </div>

  <form [formGroup]="categoriaForm" (ngSubmit)="crearCategoria()">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        placeholder="Ej: Alimentación"
        maxlength="50">
    </div>

    <div class="campo">
      <label for="tipo">Tipo</label>
      <select id="tipo" formControlName="tipo">
        <option value="gasto">Gasto</option>
        <option value="ingreso">Ingreso</option>
      </select>
    </div>

    <button type="submit" class="btn-crear" [disabled]="categoriaForm.invalid">
      Crear Categoría
    </button>
  </form>

  <div class="list-section">
    <h3>Mis Categorías</h3>
    <div class="categorias-list">
      @for (categoria of categorias; track categoria.id_categoria) {
        <div class="categoria-item">
          <div class="categoria-info">
            <span class="categoria-nombre">{{ categoria.nombre }}</span>
            <span class="categoria-tipo" [class]="categoria.tipo">{{ categoria.tipo }}</span>
          </div>
          <button
            class="btn-eliminar"
            (click)="eliminarCategoria(categoria)"
            [disabled]="categoriaEliminando === categoria.id_categoria">
            @if (categoriaEliminando === categoria.id_categoria) {
              Eliminando...
            } @else {
              Eliminar
            }
          </button>
        </div>
      } @empty {
        <p class="empty-message">No hay categorías disponibles</p>
      }
    </div>
  </div>
</div>
