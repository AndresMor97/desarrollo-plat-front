<app-alerts-container></app-alerts-container>

<header class="app-header">
  <div class="header-content">
    <div class="user-info">
      <span class="user-name">{{ usuarioNombre }}</span>
    </div>
    <h1 class="app-titulo">💰 My Money</h1>
    <div class="header-actions">
      <button class="btn-theme" (click)="toggleTheme()" [title]="themeService.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
        <span class="material-symbols-outlined">
          {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
        </span>
      </button>
      <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </div>
  </div>
</header>

<main class="contenido-seccion">
  <section *ngIf="seccionActiva === 'movimiento'" class="seccion">
    <app-transaccion></app-transaccion>
  </section>

  <section *ngIf="seccionActiva === 'saldo'" class="seccion">
    <app-saldo></app-saldo>
  </section>

  <section *ngIf="seccionActiva === 'historial'" class="seccion">
    <app-historial></app-historial>
  </section>

  <section *ngIf="seccionActiva === 'estadisticas'" class="seccion">
    <app-estadisticas></app-estadisticas>
  </section>

  <section *ngIf="seccionActiva === 'categorias'" class="seccion">
    <app-categoria></app-categoria>
  </section>
</main>

<nav class="navegacion">
  <button
    class="nav-btn"
    [class.active]="seccionActiva === 'movimiento'"
    (click)="cambiarSeccion('movimiento')">
    <span class="material-symbols-outlined">add</span>
    <span>Agregar</span>
  </button>

  <button
    class="nav-btn"
    [class.active]="seccionActiva === 'saldo'"
    (click)="cambiarSeccion('saldo')">
    <span class="material-symbols-outlined">account_balance_wallet</span>
    <span>Saldo</span>
  </button>

  <button
    class="nav-btn"
    [class.active]="seccionActiva === 'historial'"
    (click)="cambiarSeccion('historial')">
    <span class="material-symbols-outlined">receipt_long</span>
    <span>Historial</span>
  </button>

  <button
    class="nav-btn"
    [class.active]="seccionActiva === 'estadisticas'"
    (click)="cambiarSeccion('estadisticas')">
    <span class="material-symbols-outlined">pie_chart</span>
    <span>Estadísticas</span>
  </button>

  <button
    class="nav-btn"
    [class.active]="seccionActiva === 'categorias'"
    (click)="cambiarSeccion('categorias')">
    <span class="material-symbols-outlined">category</span>
    <span>Categorías</span>
  </button>
</nav>
