<div class="estadisticas-container">
  <h2>Distribución de Gastos</h2>

  <div *ngIf="cargando" class="cargando">Cargando...</div>

  <div *ngIf="!cargando && estadisticas.length === 0" class="vacio">
    No hay gastos registrados.
  </div>

  <div *ngIf="!cargando && estadisticas.length > 0" class="contenido">
    <div class="resumen-total">
      <span>Total gastado:</span>
      <strong>{{ getTotal() | currency:'COP':'symbol':'1.0-0' }}</strong>
    </div>

    <div class="barras">
      <div *ngFor="let item of estadisticas; let i = index" class="barra-item">
        <div class="barra-info">
          <span class="categoria">{{ item.categoria }}</span>
          <span class="monto">{{ item.total | currency:'COP':'symbol':'1.0-0' }}</span>
        </div>
        <div class="barra-fondo">
          <div
            class="barra-relleno"
            [style.width.%]="getPorcentaje(item.total)"
            [style.background-color]="getColores()[i % getColores().length]">
          </div>
        </div>
        <span class="porcentaje">{{ getPorcentaje(item.total) | number:'1.0-0' }}%</span>
      </div>
    </div>
  </div>
</div>
