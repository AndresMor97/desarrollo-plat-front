<div class="form-card">
  <div class="form-header">
    <h2>Nuevo Movimiento</h2>
    <p>Registra un ingreso o gasto</p>
  </div>

  <form [formGroup]="transaccionForm" (ngSubmit)="onSubmit()">
    <div class="tipo-selector">
      <button
        type="button"
        class="tipo-btn"
        [class.active]="transaccionForm.get('tipo')?.value === 'ingreso'"
        (click)="transaccionForm.get('tipo')?.setValue('ingreso')">
        <span class="material-symbols-outlined">arrow_downward</span>
        Ingreso
      </button>
      <button
        type="button"
        class="tipo-btn gasto"
        [class.active]="transaccionForm.get('tipo')?.value === 'gasto'"
        (click)="transaccionForm.get('tipo')?.setValue('gasto')">
        <span class="material-symbols-outlined">arrow_upward</span>
        Gasto
      </button>
    </div>

    <div class="campo">
      <label for="monto">Monto</label>
      <div class="input-wrapper">
        <span class="input-prefix">$</span>
        <input
          id="monto"
          type="number"
          formControlName="monto"
          placeholder="0"
          inputmode="decimal">
      </div>
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <input
        id="descripcion"
        type="text"
        formControlName="descripcion"
        placeholder="Ej: Almuerzo">
    </div>

    <div class="campo">
      <label for="id_categoria">Categoría</label>
      <select id="id_categoria" formControlName="id_categoria">
        <option *ngFor="let cat of categorias" [value]="cat.id_categoria">
          {{ cat.nombre }}
        </option>
      </select>
    </div>

    <button
      type="submit"
      class="btn-guardar"
      [disabled]="transaccionForm.invalid">
      Guardar
    </button>
  </form>
</div>
